[workspace]
resolver = "3"
members = [
  "crates/*",
  "py-stk",
]
default-members = [
  "crates/*",
]

[workspace.package]
version = "0.1.0"
authors = [
  "Lukas Turcani <lukasturcani93@gmail.com>",
]
edition = "2024"
license = "MIT"
repository = "https://github.com/lukasturcani/stk"

[workspace.dependencies]
pyo3 = "0.25.0"
regex = "1.0"
stk-error = { version = "0.1.0", path = "crates/stk-error" }
stk-molecular-graph = { version = "0.1.0", path = "crates/stk-molecular-graph" }
stk-python = { version = "0.1.0", path = "crates/stk-python" }
thiserror = "2.0.16"
